name: Build launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Point Gradle at the SDK and set TMDB options
        working-directory: launcher
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "tmdb.key=$TMDB_KEY" >> local.properties
          echo "tmdb.region=IN" >> local.properties
          echo "tmdb.feed=all" >> local.properties
      - name: Build release APK
        working-directory: launcher
        run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
